[project]
name = "dusttrace-engine"
version = "0.1.0"
description = "DustTrace data engine: ingest, PM10 forecast, plume model and Safe-Work Windows"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dusttrace = "dusttrace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dusttrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
