name: Weekly receptors

# Refreshes schools, hospitals and mapped construction sites from OpenStreetMap. Weekly is plenty.
# Needs the DATABASE_URL repository secret, like the hourly forecast.

on:
  schedule:
    - cron: "43 1 * * 1"
  workflow_dispatch:

jobs:
  osm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one ward's outage shouldn't stop the other
      max-parallel: 1
      matrix:
        ward: [K-East, P-North]
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DUSTTRACE_WARD: ${{ matrix.ward }}
    defaults:
      run:
        working-directory: services/engine
    steps:
      - name: Check secrets
        id: gate
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set, skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.ok == 'true'
        run: pip install -e .
      - name: Migrations
        if: steps.gate.outputs.ok == 'true'
        run: python -m dusttrace init-db
      - name: Schools and hospitals
        if: steps.gate.outputs.ok == 'true'
        run: python -m dusttrace osm
      - name: Housing (Census 2011 over OSM residential land)
        if: ${{ !cancelled() && steps.gate.outputs.ok == 'true' }}
        run: python -m dusttrace osm-housing
      - name: Construction sites
        # Runs even when the receptor pull fails: the two are independent, and the site pull
        # falls back to the ohsome snapshot when every Overpass mirror is down.
        if: ${{ !cancelled() && steps.gate.outputs.ok == 'true' }}
        run: python -m dusttrace osm-sites
