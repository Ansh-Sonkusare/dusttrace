name: Satellite discovery

# Sentinel-2 change over the ward (PRD F2): possible unregistered sites, and confirmation that known
# sites are active. Public imagery, no key. Monthly is enough; run by hand any time.

on:
  schedule:
    - cron: "37 2 3 * *"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one ward's outage shouldn't stop the other
      max-parallel: 1
      matrix:
        ward: [K-East, P-North]
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DUSTTRACE_WARD: ${{ matrix.ward }}
    defaults:
      run:
        working-directory: services/engine
    steps:
      - name: Check secrets
        id: gate
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set, skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.ok == 'true'
        run: pip install -e .
      - if: steps.gate.outputs.ok == 'true'
        run: python -m dusttrace init-db && python -m dusttrace discover
